######
## WooCommerce Bot & Crawl-Trap Protection
######
# Included only in WordPress vhosts with WooCommerce installed and not listed in
# woo_bot_allow_domains (see [nginx.features] in settings.conf).
#
# Server-level rewrite-phase crawl-hygiene checks on raw $args: run before
# location matching, try_files, FastCGI cache and PHP-FPM, so blocked crawler
# hits never spin up a PHP worker or create WooCommerce session rows. Ordinary
# product/category pages without these query parameters are untouched (including
# OpenGraph previews).

# Pre-check the query string once so normal requests (no WooCommerce action or
# filter parameters) skip all User-Agent, Referer and trap regexes.
set $wt_woo_act "";
set $wt_woo_flt "";
set $wt_woo_ua "";
set $wt_woo_host_ref "";
set $wt_woo_trap_args "";

if ($args ~* "(?:^|&)(?:add-to-cart|remove_item|undo_item|add_to_wishlist)=") {
    set $wt_woo_act "1";
    set $wt_woo_ua $http_user_agent;
}
if ($args ~* "(?:^|&)(?:filter_[a-z0-9_-]+|query_type_[a-z0-9_-]+|min_price|max_price|rating_filter)=") {
    set $wt_woo_flt "1";
    set $wt_woo_ua $http_user_agent;
    set $wt_woo_trap_args $args;
}

# 1a. Any crawler/bot hitting mutating cart or wishlist query actions.
# Boundary-aware bot matching avoids consumer device UAs (e.g. CUBOT phones)
# and mobile search/in-app browsers (e.g. baiduboxapp, Yandex browser).
if ($wt_woo_ua ~* "(?:\bbot\b|(?<!cu)bot[/;)]|(?<!cu)bot$|crawl|spider|slurp|archiver|bingpreview|meta-webindexer|meta-externalagent|meta-externalads|meta-externalfetcher|facebookexternalhit|facebookcatalog|facebot|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Bytespider|Amazonbot|PerplexityBot|AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|PetalBot|DataForSeoBot|Barkrowler|YandexBot|YandexMobileBot|YandexRenderResourcesBot|Baiduspider)") {
    set $wt_woo_act "${wt_woo_act}B";
}
if ($wt_woo_act = "1B") {
    return 403;
}

# 1b. Aggressive / AI / Meta / SEO crawlers hitting heavy faceted filters or
# price range queries (Googlebot is excluded here so canonical checks on 1-2
# value filtered URLs keep working).
if ($wt_woo_ua ~* "(?:meta-webindexer|meta-externalagent|meta-externalads|meta-externalfetcher|facebookexternalhit|facebookcatalog|facebot|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-Web|anthropic-ai|CCBot|Bytespider|Amazonbot|PerplexityBot|AhrefsBot|SemrushBot|MJ12bot|DotBot|BLEXBot|PetalBot|DataForSeoBot|Barkrowler|bingbot|bingpreview|YandexBot|YandexMobileBot|YandexRenderResourcesBot|Baiduspider)") {
    set $wt_woo_flt "${wt_woo_flt}B";
}
if ($wt_woo_flt = "1B") {
    return 403;
}

# 2. Non-browser HTTPS clients hitting mutating cart/wishlist actions without a
# same-host Referer (stops UA-spoofing scrapers hammering ?add-to-cart=).
# Scoped to HTTPS because browsers only send Sec-Fetch-Site to trustworthy
# origins; plain-HTTP requests still reach the HTTP->HTTPS redirect cleanly.
set $wt_woo_ref_block "";
if ($wt_woo_act = "1") {
    set $wt_woo_ref_block "1";
    set $wt_woo_host_ref "$host|$http_referer";
}
if ($scheme != "https") {
    set $wt_woo_ref_block "";
}
if ($wt_woo_host_ref ~* "^(?:www\.)?([^|]+)\|https?://(?:www\.)?\1(?::[0-9]+)?(?:/|$)") {
    set $wt_woo_ref_block "";
}
if ($http_sec_fetch_site != "") {
    set $wt_woo_ref_block "";
}
if ($wt_woo_ref_block = "1") {
    return 403;
}

# 3. Non-browser HTTPS combinatorial filter crawl traps: 3+ comma-separated
# values in a single filter_* parameter when neither Sec-Fetch-Site nor a
# same-host Referer is present. Real guest shoppers selecting 3+ values in
# WooCommerce's layered-navigation widget stay allowed.
set $wt_woo_trap "";
if ($wt_woo_trap_args ~* "(?:^|&)filter_[a-z0-9_-]+=[^&]*(?:,|%2C)[^&]*(?:,|%2C)") {
    set $wt_woo_trap "1";
    set $wt_woo_host_ref "$host|$http_referer";
}
if ($scheme != "https") {
    set $wt_woo_trap "";
}
if ($wt_woo_host_ref ~* "^(?:www\.)?([^|]+)\|https?://(?:www\.)?\1(?::[0-9]+)?(?:/|$)") {
    set $wt_woo_trap "";
}
if ($http_sec_fetch_site != "") {
    set $wt_woo_trap "";
}
if ($wt_woo_trap = "1") {
    return 403;
}
