######
## CMS Protection (WordPress) - nginx
######
# Server-level checks on the normalised URI ($uri: decoded, dot segments and
# double slashes resolved). They run before nginx picks a location, so they
# hold whatever locations the vhost has and in whatever order (a top-level
# "location ~ \.php$" listed first would win over a regex location here), they
# cover WordPress installed in a subdirectory, and they leave the vhost's own
# location handling (try_files, caching) unchanged for every other request.
# Internal redirects (try_files -> /index.php) are checked again; none matches.

# wp-config.php and every copy of it: wp-config.php.bak, .old, .save, ~,
# vim swap files (.wp-config.php.swp), wp-config.txt, wp-config-sample.php
if ($uri ~* "/\.?wp-config[^/]*$") { return 403; }

# readme / license / changelog files (version disclosure)
if ($uri ~* "/(readme|license|example|legalnotice|installation|changelog)\.(txt|html|md)$") { return 403; }

# Database dumps and editor or backup copies, anywhere
if ($uri ~* "\.(sql|sql\.gz|sql\.zip|sql\.bz2|sql\.xz|bak|old|orig|save|swp|swo)$|~$") { return 403; }

# Archives in the document root or in wp-content itself (site backups such as
# /backup.zip, /public_html.tar.gz). Archives deeper down, e.g. downloads in
# wp-content/uploads, stay available.
if ($uri ~* "^/[^/]+\.(zip|tar|tar\.gz|tgz|tar\.bz2|7z|rar|wpress)$") { return 403; }
if ($uri ~* "/wp-content/[^/]+\.(zip|tar|tar\.gz|tgz|tar\.bz2|7z|rar|wpress)$") { return 403; }

# Log files: wp-content/debug.log, plugin logs under wp-content (e.g.
# uploads/wc-logs, which hold order data), PHP error_log files anywhere
if ($uri ~* "/wp-content/.*\.log$") { return 403; }
if ($uri ~* "/(error_log|php_errorlog)$") { return 403; }

# No PHP execution in upload, cache and backup directories
if ($uri ~* "/wp-content/(uploads|cache|upgrade|languages|wflogs|ai1wm-backups|updraft|backups-dup-lite)/.*\.php$") { return 403; }

# No direct PHP in wp-includes, except the TinyMCE loader and the multisite files handler
if ($uri ~* "/wp-includes/(?!js/tinymce/wp-tinymce\.php$|ms-files\.php$).*\.php$") { return 403; }
