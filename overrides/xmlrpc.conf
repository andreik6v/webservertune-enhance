######
## XML-RPC protection
######
# Included only in WordPress vhosts without a Jetpack plugin and not listed in
# xmlrpc_allow_domains (see [nginx.features] in settings.conf).
# A server-level check on the normalised URI, so it also covers WordPress in a
# subdirectory (/blog/xmlrpc.php) whatever locations the vhost has.

if ($uri ~* "/xmlrpc\.php$") { return 403; }
